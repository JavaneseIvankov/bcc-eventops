basePath: /api/v1
definitions:
  github_com_bcc_eventops-be_internal_dto.AuthResponse:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
      token_type:
        type: string
      user:
        $ref: '#/definitions/github_com_bcc_eventops-be_internal_dto.UserResponse'
    type: object
  github_com_bcc_eventops-be_internal_dto.CreateSessionRequest:
    properties:
      description:
        type: string
      end_time:
        type: string
      location:
        type: string
      speaker:
        type: string
      start_time:
        type: string
      title:
        type: string
    type: object
  github_com_bcc_eventops-be_internal_dto.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  github_com_bcc_eventops-be_internal_dto.LogoutRequest:
    properties:
      refresh_token:
        type: string
    type: object
  github_com_bcc_eventops-be_internal_dto.RefreshRequest:
    properties:
      refresh_token:
        type: string
    type: object
  github_com_bcc_eventops-be_internal_dto.RegisterRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        type: string
    type: object
  github_com_bcc_eventops-be_internal_dto.SessionResponse:
    properties:
      description:
        type: string
      end_time:
        type: string
      event_id:
        type: string
      id:
        type: string
      location:
        type: string
      speaker:
        type: string
      start_time:
        type: string
      status:
        type: string
      title:
        type: string
    type: object
  github_com_bcc_eventops-be_internal_dto.TokenResponse:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
      token_type:
        type: string
    type: object
  github_com_bcc_eventops-be_internal_dto.UpdateSessionRequest:
    properties:
      description:
        type: string
      end_time:
        type: string
      location:
        type: string
      speaker:
        type: string
      start_time:
        type: string
      title:
        type: string
    type: object
  github_com_bcc_eventops-be_internal_dto.UpdateSessionStatusRequest:
    properties:
      status:
        type: string
    type: object
  github_com_bcc_eventops-be_internal_dto.UserResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: dev@bcc.id
    name: BCC EventOps Team
  description: Spesifikasi REST API untuk BCC EventOps. Auth menggunakan Bearer Token
    (access_token & refresh_token dikembalikan lewat response body). Konvensi JSON
    snake_case, ID UUID v4, waktu ISO 8601.
  termsOfService: http://swagger.io/terms/
  title: BCC EventOps API
  version: 1.0.0
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Kredensial login
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_bcc_eventops-be_internal_dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_bcc_eventops-be_internal_dto.AuthResponse'
        "400":
          description: Data yang dikirim tidak valid
          schema:
            type: string
        "401":
          description: Email atau password salah
          schema:
            type: string
      summary: Login pengguna dengan email dan password
      tags:
      - Auth
  /auth/logout:
    post:
      consumes:
      - application/json
      parameters:
      - description: Refresh token yang akan di-revoke
        in: body
        name: request
        schema:
          $ref: '#/definitions/github_com_bcc_eventops-be_internal_dto.LogoutRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Logout berhasil
          schema:
            type: string
      summary: Logout dan revoke refresh token
      tags:
      - Auth
  /auth/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_bcc_eventops-be_internal_dto.UserResponse'
        "401":
          description: Autentikasi diperlukan
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Mendapatkan profil pengguna yang sedang login
      tags:
      - Auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      parameters:
      - description: Refresh token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_bcc_eventops-be_internal_dto.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_bcc_eventops-be_internal_dto.TokenResponse'
        "401":
          description: Autentikasi diperlukan
          schema:
            type: string
      summary: Memperbarui access_token menggunakan refresh_token
      tags:
      - Auth
  /auth/register:
    post:
      consumes:
      - application/json
      parameters:
      - description: Data registrasi
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_bcc_eventops-be_internal_dto.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_bcc_eventops-be_internal_dto.UserResponse'
        "400":
          description: Data yang dikirim tidak valid
          schema:
            type: string
        "409":
          description: Email sudah terdaftar
          schema:
            type: string
      summary: Registrasi akun pengguna baru
      tags:
      - Auth
  /events/{eventId}/sessions:
    get:
      parameters:
      - description: UUID Event
        in: path
        name: eventId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_bcc_eventops-be_internal_dto.SessionResponse'
            type: array
        "404":
          description: Event tidak ditemukan
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Mendapatkan daftar sesi rundown terurut berdasarkan waktu mulai
      tags:
      - Sessions
    post:
      consumes:
      - application/json
      parameters:
      - description: UUID Event
        in: path
        name: eventId
        required: true
        type: string
      - description: Data sesi
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_bcc_eventops-be_internal_dto.CreateSessionRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_bcc_eventops-be_internal_dto.SessionResponse'
        "403":
          description: Hanya coordinator yang dapat menambahkan sesi
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Menambahkan sesi baru ke dalam rundown (Khusus COORDINATOR)
      tags:
      - Sessions
  /events/{eventId}/sessions/{sessionId}:
    delete:
      parameters:
      - description: UUID Event
        in: path
        name: eventId
        required: true
        type: string
      - description: UUID Sesi
        in: path
        name: sessionId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Sesi berhasil dihapus
          schema:
            type: string
        "403":
          description: Hanya coordinator yang dapat menghapus sesi
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Menghapus sesi dari rundown (Khusus COORDINATOR)
      tags:
      - Sessions
    patch:
      consumes:
      - application/json
      parameters:
      - description: UUID Event
        in: path
        name: eventId
        required: true
        type: string
      - description: UUID Sesi
        in: path
        name: sessionId
        required: true
        type: string
      - description: Data sesi yang diubah
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_bcc_eventops-be_internal_dto.UpdateSessionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_bcc_eventops-be_internal_dto.SessionResponse'
        "403":
          description: Hanya coordinator yang dapat mengedit sesi
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Mengedit detail sesi (Khusus COORDINATOR)
      tags:
      - Sessions
  /events/{eventId}/sessions/{sessionId}/status:
    patch:
      consumes:
      - application/json
      parameters:
      - description: UUID Event
        in: path
        name: eventId
        required: true
        type: string
      - description: UUID Sesi
        in: path
        name: sessionId
        required: true
        type: string
      - description: Status baru
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_bcc_eventops-be_internal_dto.UpdateSessionStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_bcc_eventops-be_internal_dto.SessionResponse'
        "400":
          description: Event sudah FINISHED sehingga status sesi tidak dapat diubah
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Memperbarui status sesi (COORDINATOR & COMMITTEE)
      tags:
      - Sessions
schemes:
- http
- https
securityDefinitions:
  BearerAuth:
    description: 'Masukkan token dengan format: Bearer {access_token}'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
