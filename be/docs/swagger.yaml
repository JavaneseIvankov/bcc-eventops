basePath: /api/v1
definitions:
  github_com_bcc_eventops-be_internal_dto.AuthResponse:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
      token_type:
        type: string
      user:
        $ref: '#/definitions/github_com_bcc_eventops-be_internal_dto.UserResponse'
    type: object
  github_com_bcc_eventops-be_internal_dto.CommitteeMemberResponse:
    properties:
      email:
        type: string
      joined_at:
        type: string
      name:
        type: string
      role:
        type: string
      user_id:
        type: string
    type: object
  github_com_bcc_eventops-be_internal_dto.CommitteeOverviewResponse:
    properties:
      invitations:
        items:
          $ref: '#/definitions/github_com_bcc_eventops-be_internal_dto.InvitationResponse'
        type: array
      members:
        items:
          $ref: '#/definitions/github_com_bcc_eventops-be_internal_dto.CommitteeMemberResponse'
        type: array
    type: object
  github_com_bcc_eventops-be_internal_dto.CreateEventRequest:
    properties:
      end_time:
        type: string
      location:
        type: string
      name:
        type: string
      poster_url:
        type: string
      quota_total:
        type: integer
      short_description:
        type: string
      start_time:
        type: string
    type: object
  github_com_bcc_eventops-be_internal_dto.CreateSessionRequest:
    properties:
      description:
        type: string
      end_time:
        type: string
      location:
        type: string
      speaker:
        type: string
      start_time:
        type: string
      title:
        type: string
    type: object
  github_com_bcc_eventops-be_internal_dto.DashboardSummaryResponse:
    properties:
      active_registrations:
        type: integer
      cancelled_count:
        type: integer
      checked_in_count:
        type: integer
      not_checked_in_count:
        type: integer
      quota_available:
        type: integer
      quota_total:
        type: integer
      sessions_summary:
        $ref: '#/definitions/github_com_bcc_eventops-be_internal_dto.SessionsSummary'
    type: object
  github_com_bcc_eventops-be_internal_dto.EventDetailResponse:
    properties:
      created_at:
        type: string
      end_time:
        type: string
      id:
        type: string
      location:
        type: string
      my_role:
        type: string
      name:
        type: string
      poster_url:
        type: string
      quota_available:
        type: integer
      quota_filled:
        type: integer
      quota_total:
        type: integer
      short_description:
        type: string
      start_time:
        type: string
      status:
        type: string
      updated_at:
        type: string
    type: object
  github_com_bcc_eventops-be_internal_dto.EventSummaryResponse:
    properties:
      end_time:
        type: string
      id:
        type: string
      location:
        type: string
      my_role:
        type: string
      name:
        type: string
      poster_url:
        type: string
      quota_available:
        type: integer
      quota_filled:
        type: integer
      quota_total:
        type: integer
      short_description:
        type: string
      start_time:
        type: string
      status:
        type: string
    type: object
  github_com_bcc_eventops-be_internal_dto.InvitationResponse:
    properties:
      created_at:
        type: string
      event_id:
        type: string
      id:
        type: string
      invitee_email:
        type: string
      invitee_name:
        type: string
      invitee_user_id:
        type: string
      role:
        type: string
      status:
        type: string
    type: object
  github_com_bcc_eventops-be_internal_dto.InviteRequest:
    properties:
      email:
        type: string
      role:
        type: string
    type: object
  github_com_bcc_eventops-be_internal_dto.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  github_com_bcc_eventops-be_internal_dto.LogoutRequest:
    properties:
      refresh_token:
        type: string
    type: object
  github_com_bcc_eventops-be_internal_dto.ParticipantResponse:
    properties:
      checked_in_at:
        type: string
      email:
        type: string
      name:
        type: string
      registered_at:
        type: string
      registration_id:
        type: string
      status:
        type: string
      user_id:
        type: string
    type: object
  github_com_bcc_eventops-be_internal_dto.RefreshRequest:
    properties:
      refresh_token:
        type: string
    type: object
  github_com_bcc_eventops-be_internal_dto.RegisterRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        type: string
    type: object
  github_com_bcc_eventops-be_internal_dto.RegistrationResponse:
    properties:
      checked_in_at:
        type: string
      event_id:
        type: string
      id:
        type: string
      qr_token:
        type: string
      registered_at:
        type: string
      status:
        type: string
      user_id:
        type: string
    type: object
  github_com_bcc_eventops-be_internal_dto.SessionResponse:
    properties:
      description:
        type: string
      end_time:
        type: string
      event_id:
        type: string
      id:
        type: string
      location:
        type: string
      speaker:
        type: string
      start_time:
        type: string
      status:
        type: string
      title:
        type: string
    type: object
  github_com_bcc_eventops-be_internal_dto.SessionsSummary:
    properties:
      finished:
        type: integer
      ongoing:
        type: integer
      total:
        type: integer
      upcoming:
        type: integer
    type: object
  github_com_bcc_eventops-be_internal_dto.TokenResponse:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
      token_type:
        type: string
    type: object
  github_com_bcc_eventops-be_internal_dto.UpdateEventRequest:
    properties:
      end_time:
        type: string
      location:
        type: string
      name:
        type: string
      poster_url:
        type: string
      quota_total:
        type: integer
      short_description:
        type: string
      start_time:
        type: string
      status:
        type: string
    type: object
  github_com_bcc_eventops-be_internal_dto.UpdateMemberRoleRequest:
    properties:
      role:
        type: string
    type: object
  github_com_bcc_eventops-be_internal_dto.UpdateSessionRequest:
    properties:
      description:
        type: string
      end_time:
        type: string
      location:
        type: string
      speaker:
        type: string
      start_time:
        type: string
      title:
        type: string
    type: object
  github_com_bcc_eventops-be_internal_dto.UpdateSessionStatusRequest:
    properties:
      status:
        type: string
    type: object
  github_com_bcc_eventops-be_internal_dto.UserResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: dev@bcc.id
    name: BCC EventOps Team
  description: Spesifikasi REST API untuk BCC EventOps. Auth menggunakan Bearer Token
    (access_token & refresh_token dikembalikan lewat response body). Konvensi JSON
    snake_case, ID UUID v4, waktu ISO 8601.
  termsOfService: http://swagger.io/terms/
  title: BCC EventOps API
  version: 1.0.0
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Kredensial login
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_bcc_eventops-be_internal_dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_bcc_eventops-be_internal_dto.AuthResponse'
        "400":
          description: Data yang dikirim tidak valid
          schema:
            type: string
        "401":
          description: Email atau password salah
          schema:
            type: string
      summary: Login pengguna dengan email dan password
      tags:
      - Auth
  /auth/logout:
    post:
      consumes:
      - application/json
      parameters:
      - description: Refresh token yang akan di-revoke
        in: body
        name: request
        schema:
          $ref: '#/definitions/github_com_bcc_eventops-be_internal_dto.LogoutRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Logout berhasil
          schema:
            type: string
      summary: Logout dan revoke refresh token
      tags:
      - Auth
  /auth/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_bcc_eventops-be_internal_dto.UserResponse'
        "401":
          description: Autentikasi diperlukan
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Mendapatkan profil pengguna yang sedang login
      tags:
      - Auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      parameters:
      - description: Refresh token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_bcc_eventops-be_internal_dto.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_bcc_eventops-be_internal_dto.TokenResponse'
        "401":
          description: Autentikasi diperlukan
          schema:
            type: string
      summary: Memperbarui access_token menggunakan refresh_token
      tags:
      - Auth
  /auth/register:
    post:
      consumes:
      - application/json
      parameters:
      - description: Data registrasi
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_bcc_eventops-be_internal_dto.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_bcc_eventops-be_internal_dto.UserResponse'
        "400":
          description: Data yang dikirim tidak valid
          schema:
            type: string
        "409":
          description: Email sudah terdaftar
          schema:
            type: string
      summary: Registrasi akun pengguna baru
      tags:
      - Auth
  /events:
    get:
      parameters:
      - description: Halaman
        in: query
        name: page
        type: integer
      - description: Jumlah per halaman
        in: query
        name: limit
        type: integer
      - description: Cari berdasarkan nama event
        in: query
        name: search
        type: string
      - description: Filter status event
        in: query
        name: status
        type: string
      - description: Filter event yang dikelola user
        in: query
        name: managed_by_me
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_bcc_eventops-be_internal_dto.EventSummaryResponse'
            type: array
      security:
      - BearerAuth: []
      summary: Katalog daftar event (Paginated)
      tags:
      - Events
    post:
      consumes:
      - application/json
      parameters:
      - description: Data event
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_bcc_eventops-be_internal_dto.CreateEventRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_bcc_eventops-be_internal_dto.EventDetailResponse'
        "400":
          description: Data yang dikirim tidak valid
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Membuat event baru (Pembuat otomatis menjadi COORDINATOR)
      tags:
      - Events
  /events/{eventId}:
    delete:
      parameters:
      - description: UUID Event
        in: path
        name: eventId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Event berhasil dihapus
          schema:
            type: string
        "403":
          description: Hanya coordinator yang dapat menghapus event
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Menghapus event beserta seluruh data terkait (Khusus COORDINATOR)
      tags:
      - Events
    get:
      parameters:
      - description: UUID Event
        in: path
        name: eventId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_bcc_eventops-be_internal_dto.EventDetailResponse'
        "404":
          description: Event tidak ditemukan
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Mendapatkan detail informasi event beserta my_role dan kuota
      tags:
      - Events
    patch:
      consumes:
      - application/json
      parameters:
      - description: UUID Event
        in: path
        name: eventId
        required: true
        type: string
      - description: Data event yang diubah
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_bcc_eventops-be_internal_dto.UpdateEventRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_bcc_eventops-be_internal_dto.EventDetailResponse'
        "400":
          description: Kapasitas baru lebih kecil dari jumlah pendaftar aktif
          schema:
            type: string
        "403":
          description: Hanya coordinator yang dapat mengubah event
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Mengubah informasi event atau kapasitas (Khusus COORDINATOR)
      tags:
      - Events
  /events/{eventId}/committees:
    get:
      parameters:
      - description: UUID Event
        in: path
        name: eventId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_bcc_eventops-be_internal_dto.CommitteeOverviewResponse'
      security:
      - BearerAuth: []
      summary: Melihat daftar anggota panitia aktif dan status undangan (Khusus Panitia/Koordinator)
      tags:
      - Committees
  /events/{eventId}/committees/{userId}:
    delete:
      parameters:
      - description: UUID Event
        in: path
        name: eventId
        required: true
        type: string
      - description: UUID Pengguna
        in: path
        name: userId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Anggota panitia berhasil dikeluarkan
          schema:
            type: string
        "409":
          description: Tidak bisa mengeluarkan Koordinator terakhir
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Mengeluarkan anggota panitia dari event (Khusus COORDINATOR)
      tags:
      - Committees
    patch:
      consumes:
      - application/json
      parameters:
      - description: UUID Event
        in: path
        name: eventId
        required: true
        type: string
      - description: UUID Pengguna
        in: path
        name: userId
        required: true
        type: string
      - description: Role baru
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_bcc_eventops-be_internal_dto.UpdateMemberRoleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_bcc_eventops-be_internal_dto.CommitteeMemberResponse'
        "409":
          description: Tidak bisa menurunkan Koordinator terakhir
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Mengubah role anggota panitia aktif (Khusus COORDINATOR)
      tags:
      - Committees
  /events/{eventId}/committees/me:
    delete:
      parameters:
      - description: UUID Event
        in: path
        name: eventId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Berhasil keluar dari kepanitiaan
          schema:
            type: string
        "409":
          description: Koordinator terakhir tidak dapat keluar sebelum menunjuk pengganti
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Keluar secara mandiri dari kepanitiaan event
      tags:
      - Committees
  /events/{eventId}/dashboard:
    get:
      parameters:
      - description: UUID Event
        in: path
        name: eventId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_bcc_eventops-be_internal_dto.DashboardSummaryResponse'
      security:
      - BearerAuth: []
      summary: Mendapatkan ringkasan statistik operasional kehadiran & sesi (COORDINATOR
        & COMMITTEE)
      tags:
      - Operations
  /events/{eventId}/invitations:
    post:
      consumes:
      - application/json
      parameters:
      - description: UUID Event
        in: path
        name: eventId
        required: true
        type: string
      - description: Data undangan
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_bcc_eventops-be_internal_dto.InviteRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_bcc_eventops-be_internal_dto.InvitationResponse'
        "404":
          description: Akun dengan email tersebut tidak ditemukan
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Mengundang pengguna terdaftar sebagai panitia/koordinator (Khusus COORDINATOR)
      tags:
      - Committees
  /events/{eventId}/invitations/{invitationId}:
    delete:
      parameters:
      - description: UUID Event
        in: path
        name: eventId
        required: true
        type: string
      - description: UUID Undangan
        in: path
        name: invitationId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Undangan berhasil dibatalkan
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Membatalkan undangan yang masih berstatus PENDING (Khusus COORDINATOR)
      tags:
      - Committees
  /events/{eventId}/participants:
    get:
      parameters:
      - description: UUID Event
        in: path
        name: eventId
        required: true
        type: string
      - description: Halaman
        in: query
        name: page
        type: integer
      - description: Jumlah per halaman
        in: query
        name: limit
        type: integer
      - description: Cari berdasarkan nama atau email
        in: query
        name: search
        type: string
      - description: Filter status pendaftaran
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_bcc_eventops-be_internal_dto.ParticipantResponse'
            type: array
      security:
      - BearerAuth: []
      summary: Mendapatkan daftar tabel peserta dengan pencarian & filter (COORDINATOR
        & COMMITTEE)
      tags:
      - Operations
  /events/{eventId}/registrations:
    post:
      parameters:
      - description: UUID Event
        in: path
        name: eventId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_bcc_eventops-be_internal_dto.RegistrationResponse'
        "400":
          description: Event tidak berstatus UPCOMING
          schema:
            type: string
        "409":
          description: Kuota penuh atau sudah terdaftar aktif
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Mendaftarkan diri sendiri sebagai peserta pada event
      tags:
      - Registrations
  /events/{eventId}/registrations/{registrationId}/cancel:
    post:
      parameters:
      - description: UUID Event
        in: path
        name: eventId
        required: true
        type: string
      - description: UUID Pendaftaran
        in: path
        name: registrationId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Pendaftaran peserta berhasil dibatalkan
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Membatalkan pendaftaran peserta lain (Khusus COORDINATOR)
      tags:
      - Registrations
  /events/{eventId}/registrations/{registrationId}/check-in:
    post:
      parameters:
      - description: UUID Event
        in: path
        name: eventId
        required: true
        type: string
      - description: UUID Pendaftaran
        in: path
        name: registrationId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_bcc_eventops-be_internal_dto.RegistrationResponse'
        "400":
          description: Pendaftaran berstatus CANCELLED atau Event sudah FINISHED
          schema:
            type: string
        "409":
          description: Peserta sudah berstatus CHECKED_IN sebelumnya
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Check-in peserta secara manual dari daftar peserta (COORDINATOR & COMMITTEE)
      tags:
      - Registrations
  /events/{eventId}/registrations/me/cancel:
    post:
      parameters:
      - description: UUID Event
        in: path
        name: eventId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Pendaftaran berhasil dibatalkan dan kuota dilepaskan
          schema:
            type: string
        "400":
          description: Event sudah dimulai/selesai atau peserta sudah check-in
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Membatalkan pendaftaran diri sendiri (Hanya saat event UPCOMING & belum
        CHECKED_IN)
      tags:
      - Registrations
  /events/{eventId}/sessions:
    get:
      parameters:
      - description: UUID Event
        in: path
        name: eventId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_bcc_eventops-be_internal_dto.SessionResponse'
            type: array
        "404":
          description: Event tidak ditemukan
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Mendapatkan daftar sesi rundown terurut berdasarkan waktu mulai
      tags:
      - Sessions
    post:
      consumes:
      - application/json
      parameters:
      - description: UUID Event
        in: path
        name: eventId
        required: true
        type: string
      - description: Data sesi
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_bcc_eventops-be_internal_dto.CreateSessionRequest'
      produces:
      - application/json
