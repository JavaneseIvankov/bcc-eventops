name: Deploy Backend Group 4

on:
  push:
    branches:
      - main
    paths:
      - "be/**"
      - ".github/workflows/deploy-be.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}

          script: |
            set -e

            echo "================================"
            echo "START BACKEND DEPLOYMENT"
            echo "================================"

            # Environment
            export PATH="/usr/local/go/bin:/home/dev/go/bin:/usr/local/bin:/usr/bin:/bin"

            echo "=== Server Information ==="
            echo "User: $(whoami)"
            echo "Home: $HOME"
            echo "PATH: $PATH"

            # Verify Go
            echo "=== Go Environment ==="

            if [ ! -x /usr/local/go/bin/go ]; then
              echo "ERROR: Go binary not found!"
              exit 1
            fi

            /usr/local/go/bin/go version
            /usr/local/go/bin/go env GOROOT
            /usr/local/go/bin/go env GOPATH

            # Navigate project
            echo "=== Navigate Project ==="
            cd /home/dev/bcc-eventops

            # Pull latest code
            echo "=== Pull Latest Code ==="
            git pull origin main

            # Navigate backend
            cd be

            # Download dependencies
            echo "=== Download Go Dependencies ==="
            /usr/local/go/bin/go mod download

            # Build application
            echo "=== Build Backend ==="
            /usr/local/go/bin/go build -o server ./cmd/api

            # Verify binary
            echo "=== Verify Build ==="

            if [ ! -f server ]; then
              echo "ERROR: Backend binary not found!"
              exit 1
            fi

            ls -lh server

            # Restart PM2
            echo "=== Restart PM2 ==="

            pm2 restart bcc-eventops-be --update-env

            # Save PM2 process list
            pm2 save

            # Check PM2 status
            echo "=== PM2 Status ==="
            pm2 status

            echo "================================"
            echo "BACKEND DEPLOYMENT SUCCESSFUL!"
            echo "================================"
