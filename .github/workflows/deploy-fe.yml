name: Deploy Frontend Group 4

on:
  push:
    branches:
      - main
    paths:
      - "fe/**"
      - ".github/workflows/deploy-fe.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bcc-eventops-deploy
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: fe/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: fe
        run: pnpm install --frozen-lockfile

      - name: Typecheck and build
        working-directory: fe
        run: pnpm build

  deploy:
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}

          script: |
            set -e

            echo "================================"
            echo "START FRONTEND DEPLOYMENT"
            echo "================================"

            echo "=== Server Information ==="
            echo "User: $(whoami)"
            echo "Home: $HOME"

            echo "=== Docker Environment ==="
            docker --version
            docker compose version

            # Navigate project
            echo "=== Navigate Project ==="
            cd /home/dev/bcc-eventops

            # Pull latest code
            echo "=== Pull Latest Code ==="
            git pull origin main

            cd fe

            # Build & restart frontend container
            echo "=== Build & Restart Frontend Container ==="
            docker compose up -d --build

            # Check container status
            echo "=== Container Status ==="
            docker compose ps
            docker compose logs --tail 50

            echo "================================"
            echo "FRONTEND DEPLOYMENT SUCCESSFUL!"
            echo "================================"
