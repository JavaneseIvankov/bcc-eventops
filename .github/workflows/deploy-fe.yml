name: Deploy Frontend Group 4

on:
  push:
    branches:
      - main
    paths:
      - "fe/**"
      - "docker-compose.yml"
      - ".github/workflows/deploy-fe.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}

          script: |
            set -e

            echo "================================"
            echo "START FRONTEND DEPLOYMENT"
            echo "================================"

            echo "=== Server Information ==="
            echo "User: $(whoami)"
            echo "Home: $HOME"

            echo "=== Docker Environment ==="
            docker --version
            docker compose version

            # Navigate project
            echo "=== Navigate Project ==="
            cd /home/dev/bcc-eventops

            # Pull latest code
            echo "=== Pull Latest Code ==="
            git pull origin main

            # Build & restart frontend container
            echo "=== Build & Restart Frontend Container ==="
            docker compose up -d --build fe

            # Check container status
            echo "=== Container Status ==="
            docker compose ps fe
            docker compose logs --tail 50 fe

            echo "================================"
            echo "FRONTEND DEPLOYMENT SUCCESSFUL!"
            echo "================================"
