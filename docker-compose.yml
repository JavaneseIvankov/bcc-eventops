services:
  be:
    build:
      context: ./be
      dockerfile: Dockerfile
    container_name: bcc-eventops-be
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - ./be/.env

  fe:
    build:
      context: ./fe
      dockerfile: Dockerfile
    container_name: bcc-eventops-fe
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - be
